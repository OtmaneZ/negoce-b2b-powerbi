name: Contrôles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer l'environnement
        run: make install PYTHON=python
      - name: Lancer les contrôles
        run: make check
